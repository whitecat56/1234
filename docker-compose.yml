services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uzdrone
      POSTGRES_USER: uzdrone
      POSTGRES_PASSWORD: uzdrone
    ports:
      - "5432:5432"
    volumes:
      - uzdrone_pg:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      UZ_DRONE_DATABASE_URL: postgresql+psycopg://uzdrone:uzdrone@postgres:5432/uzdrone
      UZ_DRONE_JWT_SECRET: change-this-secret
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  uzdrone_pg:
